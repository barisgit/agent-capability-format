name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run ci
      # Exercise the packed tarballs on the oldest Node the packages support (engines: >=20).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun scripts/packages.ts pack "$RUNNER_TEMP/packs"
      - run: bun scripts/packages.ts smoke "$RUNNER_TEMP/packs"
